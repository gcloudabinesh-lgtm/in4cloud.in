<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" fill="none">
  <!-- Background -->
  <rect width="420" height="340" rx="20" fill="#F8F7FF"/>
  <!-- App window -->
  <rect x="30" y="26" width="360" height="288" rx="14" fill="#ffffff" stroke="#E5E0F0" stroke-width="1.5"/>
  <!-- Window header bar -->
  <rect x="30" y="26" width="360" height="42" rx="14" fill="#F6F2FF"/>
  <rect x="30" y="54" width="360" height="14" fill="#F6F2FF"/>
  <circle cx="52" cy="47" r="5" fill="#FF5F57"/>
  <circle cx="70" cy="47" r="5" fill="#FEBC2E"/>
  <circle cx="88" cy="47" r="5" fill="#28C840"/>
  <rect x="150" y="40" width="150" height="14" rx="7" fill="#EDE9FE"/>
  <text x="225" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#6528F7" font-weight="600">Leave Policy Settings</text>
  <!-- Sidebar -->
  <rect x="30" y="68" width="88" height="246" fill="#FAF9FE"/>
  <rect x="30" y="68" width="1" height="246" fill="#EFEBF9"/>
  <rect x="42" y="84" width="64" height="22" rx="6" fill="#6528F7"/>
  <text x="74" y="99" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#ffffff" font-weight="600">Leave Types</text>
  <rect x="42" y="114" width="64" height="22" rx="6" fill="none" stroke="#E5E0F0"/>
  <text x="74" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#6D6990" font-weight="500">Groups</text>
  <rect x="42" y="144" width="64" height="22" rx="6" fill="none" stroke="#E5E0F0"/>
  <text x="74" y="159" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#6D6990" font-weight="500">Rules</text>
  <rect x="42" y="174" width="64" height="22" rx="6" fill="none" stroke="#E5E0F0"/>
  <text x="74" y="189" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#6D6990" font-weight="500">Holidays</text>
  <rect x="42" y="204" width="64" height="22" rx="6" fill="none" stroke="#E5E0F0"/>
  <text x="74" y="219" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#6D6990" font-weight="500">Workflow</text>
  <!-- Main content: policy rows -->
  <text x="136" y="96" font-family="Inter, sans-serif" font-size="10" fill="#0F0E20" font-weight="700">Leave Types</text>
  <text x="378" y="96" text-anchor="end" font-family="Inter, sans-serif" font-size="8" fill="#72BF44" font-weight="700">+ Add New</text>
  <!-- Row 1: Casual Leave -->
  <rect x="132" y="106" width="246" height="38" rx="8" fill="#F6F2FF" stroke="#E7DCFF"/>
  <rect x="142" y="114" width="22" height="22" rx="6" fill="#6528F7"/>
  <text x="153" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#ffffff" font-weight="700">CL</text>
  <text x="172" y="122" font-family="Inter, sans-serif" font-size="9" fill="#0F0E20" font-weight="700">Casual Leave</text>
  <text x="172" y="133" font-family="Inter, sans-serif" font-size="7.5" fill="#6D6990">12 days · Monthly accrual</text>
  <rect x="330" y="118" width="38" height="14" rx="7" fill="#DCFCE7"/>
  <text x="349" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#16A34A" font-weight="700">Active</text>
  <!-- Row 2: Sick Leave -->
  <rect x="132" y="150" width="246" height="38" rx="8" fill="#ffffff" stroke="#EFEBF9"/>
  <rect x="142" y="158" width="22" height="22" rx="6" fill="#72BF44"/>
  <text x="153" y="173" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#ffffff" font-weight="700">SL</text>
  <text x="172" y="166" font-family="Inter, sans-serif" font-size="9" fill="#0F0E20" font-weight="700">Sick Leave</text>
  <text x="172" y="177" font-family="Inter, sans-serif" font-size="7.5" fill="#6D6990">8 days · No carry forward</text>
  <rect x="330" y="162" width="38" height="14" rx="7" fill="#DCFCE7"/>
  <text x="349" y="172" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#16A34A" font-weight="700">Active</text>
  <!-- Row 3: Earned Leave -->
  <rect x="132" y="194" width="246" height="38" rx="8" fill="#ffffff" stroke="#EFEBF9"/>
  <rect x="142" y="202" width="22" height="22" rx="6" fill="#F97316"/>
  <text x="153" y="217" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#ffffff" font-weight="700">EL</text>
  <text x="172" y="210" font-family="Inter, sans-serif" font-size="9" fill="#0F0E20" font-weight="700">Earned Leave</text>
  <text x="172" y="221" font-family="Inter, sans-serif" font-size="7.5" fill="#6D6990">15 days · Encashable</text>
  <rect x="330" y="206" width="38" height="14" rx="7" fill="#DCFCE7"/>
  <text x="349" y="216" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#16A34A" font-weight="700">Active</text>
  <!-- Row 4: Pro-rata indicator -->
  <rect x="132" y="238" width="246" height="38" rx="8" fill="#F0FAEE" stroke="#D9EFC9"/>
  <rect x="142" y="246" width="22" height="22" rx="6" fill="#72BF44"/>
  <text x="153" y="261" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#ffffff" font-weight="700">%</text>
  <text x="172" y="254" font-family="Inter, sans-serif" font-size="9" fill="#0F0E20" font-weight="700">Pro-Rata Calculation</text>
  <text x="172" y="265" font-family="Inter, sans-serif" font-size="7.5" fill="#508F2B">Proportional to employment period</text>
  <rect x="330" y="250" width="38" height="14" rx="7" fill="#72BF44"/>
  <text x="349" y="260" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#ffffff" font-weight="700">Auto</text>
  <!-- Floating badges -->
  <g>
    <rect x="320" y="18" width="86" height="30" rx="10" fill="#ffffff" stroke="#E7DCFF"/>
    <circle cx="338" cy="33" r="8" fill="#6528F7"/>
    <text x="338" y="37" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#ffffff" font-weight="700">18</text>
    <text x="352" y="30" font-family="Inter, sans-serif" font-size="7" fill="#6D6990">Leave types</text>
    <text x="352" y="39" font-family="Inter, sans-serif" font-size="8" fill="#0F0E20" font-weight="700">Configured</text>
  </g>
  <g>
    <rect x="18" y="270" width="120" height="32" rx="10" fill="#ffffff" stroke="#D9EFC9"/>
    <rect x="28" y="279" width="14" height="14" rx="4" fill="#72BF44"/>
    <text x="35" y="289" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#ffffff" font-weight="700">CF</text>
    <text x="48" y="283" font-family="Inter, sans-serif" font-size="7" fill="#6D6990">Carry forward</text>
    <text x="48" y="292" font-family="Inter, sans-serif" font-size="8" fill="#0F0E20" font-weight="700">Up to 5 days</text>
  </g>
  <g>
    <rect x="300" y="318" width="104" height="0" rx="10" fill="none"/>
  </g>
</svg>