<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="Wall mounted biometric attendance terminal recognising an employee face, with a shift timeline and face, card and QR check-in methods">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F1FF"/><stop offset="1" stop-color="#E4F4FF"/>
    </linearGradient>
    <linearGradient id="dev" x1="214" y1="96" x2="386" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B2A63"/><stop offset="1" stop-color="#1F1739"/>
    </linearGradient>
    <linearGradient id="scr" x1="234" y1="150" x2="366" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C2350"/><stop offset="1" stop-color="#141026"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#6528F7" flood-opacity="0.18"/>
    </filter>
  </defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .g{transform-box:fill-box;transform-origin:center}
    .sweep{animation:sweep 3.2s ease-in-out infinite}
    @keyframes sweep{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(126px);opacity:.75}}
    .ping{animation:ping 2.4s ease-out infinite}
    @keyframes ping{0%{transform:scale(.55);opacity:.8}100%{transform:scale(2);opacity:0}}
    .flow{animation:flow 2.6s linear infinite}
    @keyframes flow{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(96px);opacity:0}}
    .dash{stroke-dasharray:7 7;animation:dash 1.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
    .pop{transform-box:fill-box;transform-origin:left center;animation:pop 3.4s cubic-bezier(.22,.61,.36,1) infinite}
    @keyframes pop{0%{transform:scaleX(0)}40%,100%{transform:scaleX(1)}}
    .tick{transform-box:fill-box;transform-origin:center;animation:tick 3.4s steps(4) infinite}
    @keyframes tick{0%,100%{transform:scale(.4);opacity:.35}50%{transform:scale(1);opacity:1}}
    .float{animation:float 5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .nod{transform-box:fill-box;transform-origin:center;animation:nod 4.6s ease-in-out infinite}
    @keyframes nod{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  </style>

  <rect width="640" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="78" cy="72" r="62" fill="#FFFFFF" fill-opacity="0.36"/>
  <circle cx="580" cy="438" r="66" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- ============ terminal ============ -->
  <path d="M262 54h56v22h-56z" fill="#C6BCEC"/>
  <g filter="url(#soft)"><rect x="214" y="70" width="172" height="266" rx="26" fill="url(#dev)"/></g>
  <rect x="230" y="86" width="140" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle class="tick g" cx="242" cy="91" r="4" fill="#8F7BFF"/>
  <circle cx="300" cy="91" r="4" fill="#4B3E7A"/>
  <rect x="232" y="106" width="136" height="184" rx="14" fill="url(#scr)"/>

  <!-- scan frame + face on screen -->
  <rect class="dash" x="256" y="140" width="88" height="96" rx="12" stroke="#A78BFA" stroke-width="3" fill="none"/>
  <circle cx="300" cy="180" r="22" fill="#FFD9B8"/>
  <path d="M279 178a21 21 0 0 1 42 0v4h-42v-4z" fill="#3B2A63"/>
  <path d="M268 234c6-26 16-36 32-36s26 10 32 36z" fill="#4C3AD6"/>
  <circle cx="291" cy="180" r="3" fill="#3B2A63"/><circle cx="309" cy="180" r="3" fill="#3B2A63"/>
  <path class="sweep g" d="M244 148h112l0 3h-112z" fill="#7BE0A6"/>
  <rect x="248" y="258" width="104" height="22" rx="11" fill="#4E9B22"/>
  <text x="300" y="273" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF" letter-spacing="1">CHECKED IN</text>

  <!-- verified badge -->
  <g filter="url(#soft)"><circle cx="400" cy="96" r="30" fill="#FFFFFF"/></g>
  <circle cx="400" cy="96" r="23" fill="#E8F7E0"/>
  <path d="M389 96l8 8 15-15" stroke="#4E9B22" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ employee in front of terminal ============ -->
  <g class="nod g">
    <ellipse cx="176" cy="404" rx="86" ry="16" fill="#C9BCF5" fill-opacity="0.45"/>
    <circle cx="176" cy="230" r="38" fill="#FFD9B8"/>
    <path d="M138 228a38 38 0 0 1 76 0v6h-76v-6z" fill="#2F2348"/>
    <path d="M162 222h6M184 222h6" stroke="#2F2348" stroke-width="4" stroke-linecap="round"/>
    <path d="M166 246a14 9 0 0 0 20 0" stroke="#B97A52" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M118 400c10-56 30-78 58-78s48 22 58 78v6H118v-6z" fill="#5B34D6"/>
    <path d="M152 322l24 44 24-44" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="5" fill="none"/>
  </g>
  <circle class="ping g" cx="176" cy="230" r="46" stroke="#8B5CF6" stroke-width="3" fill="none"/>

  <!-- ============ shift timeline ============ -->
  <g filter="url(#soft)"><rect x="418" y="150" width="180" height="176" rx="20" fill="#FFFFFF"/></g>
  <text x="438" y="180" font-size="10" font-weight="bold" fill="#A79BD8" letter-spacing="1.4">TODAY'S SHIFT</text>
  <g>
    <circle cx="442" cy="204" r="6" fill="#4E9B22"/><rect x="458" y="200" width="86" height="8" rx="4" fill="#E4DBFF"/>
    <rect x="458" y="200" width="60" height="8" rx="4" fill="#6DBE45"/>
    <text x="576" y="208" text-anchor="end" font-size="10" font-weight="bold" fill="#4E9B22">09:12</text>
  </g>
  <g>
    <circle cx="442" cy="234" r="6" fill="#8B5CF6"/><rect x="458" y="230" width="86" height="8" rx="4" fill="#E4DBFF"/>
    <rect class="pop" x="458" y="230" width="78" height="8" rx="4" fill="#8B5CF6"/>
    <text x="576" y="238" text-anchor="end" font-size="10" fill="#A79BD8">18:30</text>
  </g>
  <g>
    <circle cx="442" cy="264" r="6" fill="#E8A33D"/><rect x="458" y="260" width="86" height="8" rx="4" fill="#E4DBFF"/>
    <rect x="458" y="260" width="66" height="8" rx="4" fill="#F0B45E"/>
    <text x="576" y="268" text-anchor="end" font-size="10" fill="#A79BD8">6h 18m</text>
  </g>
  <path d="M438 282h140" stroke="#F1ECFF" stroke-width="2"/>
  <text x="438" y="304" font-size="10.5" fill="#8B7FC4">Present 214</text>
  <circle cx="496" cy="300" r="3.5" fill="#E8A33D"/><text x="504" y="304" font-size="10.5" fill="#8B7FC4">Late 12</text>
  <circle cx="546" cy="300" r="3.5" fill="#FF7A93"/><text x="554" y="304" font-size="10.5" fill="#8B7FC4">Absent 8</text>

  <!-- ============ cloud data flow ============ -->
  <g>
    <path class="dash" d="M398 250h56" stroke="#8B5CF6" stroke-width="3"/>
    <circle class="flow g" cx="400" cy="250" r="5" fill="#8B5CF6"/>
    <path d="M472 106h108a24 24 0 0 1 0 48H486a20 20 0 0 1-14-38z" fill="#FFFFFF" filter="url(#soft)"/>
    <path d="M520 154v34" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>
    <text x="524" y="135" font-size="11" font-weight="bold" fill="#5B34D6">HRMS</text>
    <text x="524" y="149" font-size="9.5" fill="#A79BD8">synced live</text>
  </g>

  <!-- ============ check-in methods ============ -->
  <g transform="translate(56,0)">
    <g filter="url(#soft)"><rect x="0" y="396" width="164" height="58" rx="18" fill="#FFFFFF"/></g>
    <circle cx="30" cy="425" r="17" fill="#F0EBFF"/>
    <g stroke="#6C35FF" stroke-width="2.6" fill="none" stroke-linecap="round"><path d="M30 415v7"/><path d="M23 421a8 8 0 0 0 0 8"/><path d="M37 421a8 8 0 0 1 0 8"/><path d="M19 417a14 14 0 0 0 0 16"/></g>
    <text x="56" y="422" font-size="11.5" font-weight="bold" fill="#3A2A6B">Face ID</text>
    <text x="56" y="438" font-size="10" fill="#A79BD8">98% match</text>
  </g>
  <g transform="translate(238,0)">
    <g filter="url(#soft)"><rect x="0" y="396" width="164" height="58" rx="18" fill="#FFFFFF"/></g>
    <circle cx="30" cy="425" r="17" fill="#E6F5FF"/>
    <rect x="21" y="415" width="18" height="20" rx="4" fill="#22C7D6"/>
    <rect x="24" y="419" width="12" height="3" rx="1.5" fill="#FFFFFF"/><rect x="24" y="425" width="12" height="3" rx="1.5" fill="#FFFFFF"/>
    <g stroke="#22C7D6" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M42 419a7 7 0 0 1 0 10"/><path d="M47 415a12 12 0 0 1 0 18"/></g>
    <text x="66" y="422" font-size="11.5" font-weight="bold" fill="#3A2A6B">RFID card</text>
    <text x="66" y="438" font-size="10" fill="#A79BD8">tap &amp; go</text>
  </g>
  <g transform="translate(420,0)">
    <g filter="url(#soft)"><rect x="0" y="396" width="164" height="58" rx="18" fill="#FFFFFF"/></g>
    <circle cx="30" cy="425" r="17" fill="#EAF7E4"/>
    <g fill="#6DBE45"><rect x="22" y="417" width="7" height="7" rx="2"/><rect x="31" y="417" width="7" height="7" rx="2"/><rect x="22" y="426" width="7" height="7" rx="2"/><rect x="34" y="429" width="4" height="4" rx="1"/></g>
    <text x="60" y="422" font-size="11.5" font-weight="bold" fill="#3A2A6B">Mobile QR</text>
    <text x="60" y="438" font-size="10" fill="#A79BD8">geo-fenced</text>
  </g>
  <g class="float g"><circle cx="596" cy="380" r="5" fill="#7BE0A6"/></g>
</svg>