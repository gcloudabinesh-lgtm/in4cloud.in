<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="Ceiling-mounted IP camera with a facial recognition overlay and a cloud connection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF4FF"/>
      <stop offset="1" stop-color="#E7DEFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6528F7" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="560" cy="70" r="80" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="70" cy="430" r="66" fill="#FFFFFF" fill-opacity="0.28"/>

  <!-- Ceiling mount camera -->
  <rect x="286" y="34" width="68" height="18" rx="9" fill="#B9AEE8"/>
  <path d="M292 52h56l10 30H282l10-30z" fill="#FFFFFF" filter="url(#soft)"/>
  <circle cx="320" cy="92" r="14" fill="#241B3F"/>
  <circle cx="320" cy="92" r="6" fill="#6528F7"/>
  <circle cx="326" cy="86" r="3" fill="#8F7BFF"/>

  <!-- Scan cone -->
  <path d="M300 102L150 300h340L340 102z" fill="#6528F7" fill-opacity="0.08"/>

  <!-- Person with face recognition frame -->
  <circle cx="320" cy="238" r="34" fill="#FFD9B8"/>
  <path d="M286 236a34 34 0 0 1 68 0v6h-68v-6z" fill="#3B2A63"/>
  <path d="M270 330c8-42 26-60 50-60s42 18 50 60v14H270v-14z" fill="#4C3AD6"/>
  <rect x="272" y="196" width="96" height="96" rx="14" fill="none" stroke="#6528F7" stroke-width="3" stroke-dasharray="14 10"/>
  <rect x="272" y="290" width="96" height="24" rx="8" fill="#6528F7"/>
  <text x="320" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">ID MATCHED</text>

  <!-- Cloud connection -->
  <path d="M420 70h110a26 26 0 0 1 0 52H430a22 22 0 0 1-10-42z" fill="#FFFFFF" filter="url(#soft)"/>
  <path d="M465 92v44" stroke="#6528F7" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>

  <!-- Dashboard card -->
  <g filter="url(#soft)">
    <rect x="84" y="330" width="180" height="92" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="102" y="348" width="80" height="8" rx="4" fill="#6528F7"/>
  <rect x="102" y="366" width="140" height="6" rx="3" fill="#E4DBFF"/>
  <rect x="102" y="382" width="110" height="6" rx="3" fill="#F0EBFF"/>
  <circle cx="238" cy="374" r="16" fill="#F0EBFF"/>
  <path d="M230 374l5 5 10-10" stroke="#6528F7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Anomaly alert chip -->
  <g filter="url(#soft)">
    <rect x="428" y="300" width="132" height="46" rx="23" fill="#FFFFFF"/>
  </g>
  <circle cx="454" cy="323" r="14" fill="#F0EBFF"/>
  <path d="M454 315v4l4 4" stroke="#6528F7" stroke-width="3" stroke-linecap="round"/>
  <text x="476" y="328" font-family="Arial, sans-serif" font-weight="bold" font-size="12.5" fill="#3A2A6B">Instant alerts</text>
</svg>
