<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="Visitor check-in at a reception desk with QR pass and parking access">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1EAFF"/>
      <stop offset="1" stop-color="#E4DBFF"/>
    </linearGradient>
    <linearGradient id="desk" x1="120" y1="300" x2="520" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6528F7"/>
      <stop offset="1" stop-color="#9779FF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F2FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6528F7" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="540" cy="80" r="90" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="90" cy="420" r="70" fill="#FFFFFF" fill-opacity="0.28"/>

  <!-- Reception desk -->
  <rect x="150" y="300" width="340" height="96" rx="18" fill="url(#desk)" filter="url(#soft)"/>
  <rect x="150" y="300" width="340" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.22"/>
  <rect x="196" y="342" width="60" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="196" y="362" width="38" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- Receptionist -->
  <circle cx="430" cy="220" r="26" fill="#FFD9B8"/>
  <path d="M404 218c0-16 12-26 26-26s26 10 26 26c0 4-1 7-2 10 2-12-8-20-24-20s-26 8-24 20c-1-3-2-6-2-10z" fill="#3B2A63"/>
  <path d="M398 300c4-30 18-44 32-44s28 14 32 44v18H398v-18z" fill="#4C3AD6"/>
  <rect x="420" y="252" width="20" height="18" rx="9" fill="#FFD9B8"/>

  <!-- Visitor -->
  <circle cx="238" cy="212" r="24" fill="#F2C9A0"/>
  <path d="M214 210c0-14 10-24 24-24s24 10 24 24l-6 2c-2-10-8-16-18-16s-16 6-18 16l-6-2z" fill="#241B3F"/>
  <path d="M206 300c4-28 16-40 32-40s28 12 32 40v20H206v-20z" fill="#8F7BFF"/>

  <!-- Visitor pass on lanyard -->
  <path d="M228 262l10 22 10-22" stroke="#6528F7" stroke-width="4" stroke-linecap="round" fill="none"/>
  <rect x="226" y="284" width="26" height="34" rx="6" fill="#FFFFFF" stroke="#C9BDFF" stroke-width="2"/>
  <rect x="232" y="292" width="14" height="8" rx="4" fill="#6528F7"/>
  <rect x="232" y="306" width="14" height="4" rx="2" fill="#C9BDFF"/>
  <rect x="232" y="314" width="9" height="4" rx="2" fill="#E4DBFF"/>

  <!-- QR code card -->
  <g filter="url(#soft)">
    <rect x="360" y="120" width="150" height="118" rx="16" fill="url(#card)"/>
  </g>
  <rect x="382" y="142" width="60" height="60" rx="8" fill="#FFFFFF" stroke="#E4DBFF" stroke-width="2"/>
  <g fill="#241B3F">
    <rect x="390" y="150" width="10" height="10" rx="2"/>
    <rect x="424" y="150" width="10" height="10" rx="2"/>
    <rect x="390" y="184" width="10" height="10" rx="2"/>
    <rect x="406" y="166" width="8" height="8" rx="2"/>
    <rect x="424" y="174" width="10" height="10" rx="2"/>
    <rect x="408" y="186" width="8" height="8" rx="2"/>
  </g>
  <rect x="456" y="146" width="38" height="8" rx="4" fill="#6528F7"/>
  <rect x="456" y="164" width="30" height="6" rx="3" fill="#C9BDFF"/>
  <rect x="456" y="178" width="34" height="6" rx="3" fill="#E4DBFF"/>
  <rect x="382" y="212" width="106" height="8" rx="4" fill="#F0EBFF"/>

  <!-- Parking chip -->
  <g filter="url(#soft)">
    <rect x="96" y="96" width="128" height="46" rx="23" fill="#FFFFFF"/>
  </g>
  <circle cx="122" cy="119" r="14" fill="#6528F7"/>
  <text x="122" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF">P</text>
  <text x="146" y="124" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#3A2A6B">Parking access</text>

  <!-- Host notification chip -->
  <g filter="url(#soft)">
    <rect x="404" y="330" width="140" height="46" rx="23" fill="#FFFFFF"/>
  </g>
  <circle cx="430" cy="353" r="14" fill="#F0EBFF"/>
  <path d="M430 345v2l5 5" stroke="#6528F7" stroke-width="3" stroke-linecap="round"/>
  <text x="452" y="358" font-family="Arial, sans-serif" font-weight="bold" font-size="12.5" fill="#3A2A6B">Host notified</text>
</svg>
