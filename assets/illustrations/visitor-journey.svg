<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" role="img" aria-labelledby="t d">
<title id="t">A visit with IN4 Pro-Visit</title><desc id="d">A visitor arrives with a QR invite on their phone, scans it at the lobby kiosk, the host is notified and approves on their phone, the turnstile opens, and the visitor walks in with a digital pass while the visit is logged.</desc>
