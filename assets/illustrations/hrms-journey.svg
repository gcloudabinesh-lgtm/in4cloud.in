<title id="t">IN4 CloudHR's payroll engine</title><desc id="d">Attendance from face and biometric devices, leave from the app and GPS check-ins from field staff flow into IN4 CloudHR, which syncs attendance, leave and overtime, calculates salary and tax, locks payroll and publishes payslips to every employee's phone along with statutory reports.</desc>
