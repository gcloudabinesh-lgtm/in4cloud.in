<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" role="img" aria-labelledby="t d">
<title id="t">A vehicle's journey with IN4 Pro-Parking</title><desc id="d">An ANPR camera reads the plate, a QR token is issued and the barrier lifts, a welcome screen shows the bay, the bay is assigned automatically, the driver pays at the kiosk or in the app, and the barrier opens to let the car out.</desc>
<style>
.lbl{font:600 19px "Plus Jakarta Sans","Inter","Segoe UI",Arial,sans-serif;fill:#3a3552}
.sm{font:700 11px "Inter","Segoe UI",Arial,sans-serif}
.dash{animation:dash 1.6s linear infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 4.5s ease-in-out infinite}
.float2{animation:float 5.2s ease-in-out -2s infinite}
.blink{animation:blink 1.4s ease-in-out infinite}
.beam{animation:beam 2.6s ease-in-out infinite}
.arm{animation:arm 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
.drive{animation:drive 6s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-34}}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes blink{50%{opacity:.25}}
@keyframes beam{0%,100%{opacity:.15}50%{opacity:.6}}
@keyframes arm{0%,30%,100%{transform:rotate(0)}45%,80%{transform:rotate(-68deg)}}
@keyframes drive{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
