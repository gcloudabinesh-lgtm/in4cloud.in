<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="Workplace automation workflow showing a trigger, a rules engine and automatic actions across HR, access and payroll modules">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1FAEA"/><stop offset="1" stop-color="#E5F4FF"/>
    </linearGradient>
    <linearGradient id="hub" x1="268" y1="118" x2="372" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8AD158"/><stop offset="1" stop-color="#3E7A16"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#B6DCA0"/><stop offset="1" stop-color="#6DBE45"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#3E7A16" flood-opacity="0.2"/>
    </filter>
  </defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .g{transform-box:fill-box;transform-origin:center}
    .draw{stroke-dasharray:10 8;animation:draw 1.8s linear infinite}
    @keyframes draw{to{stroke-dashoffset:-36}}
    .run{transform-box:fill-box;transform-origin:left center;animation:run 4s cubic-bezier(.22,.61,.36,1) infinite}
    @keyframes run{0%{transform:scaleX(0);opacity:0}18%{opacity:1}70%,100%{transform:scaleX(1);opacity:1}}
    .pop{transform-box:fill-box;transform-origin:center;animation:pop 4s cubic-bezier(.22,.61,.36,1) infinite}
    @keyframes pop{0%,6%{transform:scale(.72);opacity:.35}26%,100%{transform:scale(1);opacity:1}}
    .pulse{animation:pulse 2.6s ease-out infinite}
    @keyframes pulse{0%{transform:scale(.65);opacity:.85}100%{transform:scale(1.8);opacity:0}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bob{animation:bob 4.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .twinkle{animation:twinkle 2.2s ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
  </style>

  <rect width="640" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="580" cy="68" r="68" fill="#FFFFFF" fill-opacity="0.36"/>
  <circle cx="66" cy="440" r="56" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- ============ connectors ============ -->
  <g stroke="url(#flow)" stroke-width="5" fill="none" stroke-linecap="round">
    <path class="draw" d="M320 92v34"/>
    <path class="draw" d="M228 196h44"/>
    <path class="draw" d="M412 196h-44"/>
    <path class="draw" d="M232 296h40v-32"/>
    <path class="draw" d="M408 296h-40v-32"/>
    <path class="draw" d="M320 296v-32"/>
  </g>

  <!-- ============ trigger node ============ -->
  <g class="pop g" filter="url(#soft)"><rect x="216" y="52" width="208" height="44" rx="22" fill="#FFFFFF"/></g>
  <circle cx="244" cy="74" r="14" fill="#EAF7E4"/>
  <path d="M238 74h12M244 68v12" stroke="#6DBE45" stroke-width="3" stroke-linecap="round"/>
  <text x="268" y="70" font-size="10.5" font-weight="bold" fill="#3A2A6B">TRIGGER</text>
  <text x="268" y="84" font-size="9.5" fill="#A79BD8">Employee applies leave</text>

  <!-- ============ rules hub ============ -->
  <g filter="url(#soft)"><rect x="226" y="126" width="188" height="140" rx="26" fill="url(#hub)"/></g>
  <g class="spin g" opacity=".5">
    <circle cx="320" cy="196" r="56" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="3" stroke-dasharray="10 12"/>
  </g>
  <circle cx="320" cy="196" r="38" fill="#FFFFFF" fill-opacity=".95"/>
  <g fill="#4E9B22">
    <rect x="310" y="164" width="20" height="26" rx="8"/>
    <rect x="310" y="204" width="20" height="26" rx="8"/>
    <rect x="278" y="186" width="26" height="20" rx="8"/>
    <rect x="336" y="186" width="26" height="20" rx="8"/>
    <rect x="310" y="164" width="20" height="26" rx="8" transform="rotate(45 320 196)"/>
    <rect x="310" y="204" width="20" height="26" rx="8" transform="rotate(45 320 196)"/>
    <rect x="278" y="186" width="26" height="20" rx="8" transform="rotate(45 320 196)"/>
    <rect x="336" y="186" width="26" height="20" rx="8" transform="rotate(45 320 196)"/>
  </g>
  <circle cx="320" cy="196" r="13" fill="#FFFFFF"/>
  <circle cx="320" cy="196" r="6" fill="#4E9B22"/>
  <circle class="pulse g" cx="320" cy="196" r="46" fill="none" stroke="#8AD158" stroke-width="3"/>
  <text x="320" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3E7A16">RULES ENGINE · 12 active</text>

  <!-- ============ condition node (left) ============ -->
  <g class="pop g" style="animation-delay:.15s" filter="url(#soft)"><rect x="48" y="170" width="180" height="52" rx="20" fill="#FFFFFF"/></g>
  <circle cx="76" cy="196" r="15" fill="#E6F5FF"/>
  <path d="M68 196l6 6 10-12" stroke="#1B93C6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="100" y="192" font-size="10.5" font-weight="bold" fill="#3A2A6B">Balance &gt; 12 days</text>
  <text x="100" y="206" font-size="9.5" fill="#A79BD8">policy check passed</text>

  <!-- ============ condition node (right) ============ -->
  <g class="pop g" style="animation-delay:.3s" filter="url(#soft)"><rect x="412" y="170" width="180" height="52" rx="20" fill="#FFFFFF"/></g>
  <circle cx="440" cy="196" r="15" fill="#FFF1DC"/>
  <path d="M433 196l5 5 9-10" stroke="#D9761B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="464" y="192" font-size="10.5" font-weight="bold" fill="#3A2A6B">Manager notified</text>
  <text x="464" y="206" font-size="9.5" fill="#A79BD8">on Slack + email</text>

  <!-- ============ action nodes ============ -->
  <g class="pop g" style="animation-delay:.5s" filter="url(#soft)"><rect x="120" y="296" width="152" height="58" rx="20" fill="#FFFFFF"/></g>
  <circle cx="150" cy="325" r="16" fill="#EAF7E4"/>
  <path d="M143 330v-12l7-8 7 8v12z" fill="#6DBE45"/>
  <text x="176" y="320" font-size="10.5" font-weight="bold" fill="#3A2A6B">Approve leave</text>
  <text x="176" y="336" font-size="9.5" fill="#A79BD8">auto in 2s</text>

  <g class="pop g" style="animation-delay:.65s" filter="url(#soft)"><rect x="288" y="296" width="152" height="58" rx="20" fill="#FFFFFF"/></g>
  <circle cx="318" cy="325" r="16" fill="#E6F5FF"/>
  <rect x="310" y="317" width="16" height="17" rx="4" fill="#1B93C6"/>
  <rect x="313" y="321" width="10" height="3" rx="1.5" fill="#FFFFFF"/>
  <rect x="313" y="326" width="10" height="3" rx="1.5" fill="#FFFFFF"/>
  <text x="344" y="320" font-size="10.5" font-weight="bold" fill="#3A2A6B">Update calendar</text>
  <text x="344" y="336" font-size="9.5" fill="#A79BD8">team + desk</text>

  <g class="pop g" style="animation-delay:.8s" filter="url(#soft)"><rect x="456" y="296" width="152" height="58" rx="20" fill="#FFFFFF"/></g>
  <circle cx="486" cy="325" r="16" fill="#F5F1FF"/>
  <path d="M478 330a8 8 0 0 1 16 0z" fill="#6C35FF"/><circle cx="486" cy="317" r="4" fill="#6C35FF"/>
  <text x="512" y="320" font-size="10.5" font-weight="bold" fill="#3A2A6B">Adjust payroll</text>
  <text x="512" y="336" font-size="9.5" fill="#A79BD8">LOP recalculated</text>

  <!-- flow pulse travelling the bus -->
  <rect class="run g" x="120" y="381" width="488" height="6" rx="3" fill="#6DBE45"/>

  <!-- ============ outcome chips ============ -->
  <g class="bob g" filter="url(#soft)"><rect x="48" y="404" width="196" height="48" rx="24" fill="#FFFFFF"/></g>
  <circle cx="76" cy="428" r="15" fill="#E8F7E0"/>
  <path d="M69 428l5 5 10-10" stroke="#4E9B22" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="100" y="433" font-size="12.5" font-weight="bold" fill="#274A12">Auto-approved</text>

  <g filter="url(#soft)"><rect x="260" y="404" width="176" height="48" rx="24" fill="#FFFFFF"/></g>
  <circle cx="288" cy="428" r="15" fill="#E6F5FF"/>
  <path d="M281 424v-6l7-8 7 8v6z" fill="#1B93C6"/>
  <text x="312" y="433" font-size="12.5" font-weight="bold" fill="#123C4A">8 hrs saved/day</text>

  <g filter="url(#soft)"><rect x="452" y="404" width="150" height="48" rx="24" fill="#FFFFFF"/></g>
  <circle cx="480" cy="428" r="15" fill="#FFF1DC"/>
  <path d="M473 432h14M480 425v7" stroke="#D9761B" stroke-width="3" stroke-linecap="round"/>
  <text x="504" y="433" font-size="12.5" font-weight="bold" fill="#7A3B08">0 escalations</text>
  <circle class="twinkle" cx="586" cy="428" r="4" fill="#6DBE45"/>
</svg>